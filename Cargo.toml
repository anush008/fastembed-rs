[package]
name = "fastembed"
version = "7.4.1"
edition = "2021"
rust-version = "1.88"
description = "Library for generating vector embeddings, reranking locally."
license = "Apache-2.0"
authors = [
  "Anush008 <mail@anush.sh>",
  "Josh Niemelä <josh@jniemela.dk>",
  "GrisiaEvy <a115020115@gmail.com>",
  "George MacKerron <georgemackerron@neon.tech>",
  "Timon Vonk <mail@timonv.nl>",
  "Luya Wang <luya.wang@qq.com>",
  "Tri <tri@triandco.com>",
  "Denny Wong <denwong47@hotmail.com>",
  "Alex Rozgo <alex.rozgo@gmail.com>",
  "Gil <dddhkts1@gmail.com>",
]
documentation = "https://docs.rs/fastembed"
repository = "https://github.com/Anush008/fastembed-rs"
homepage = "https://crates.io/crates/fastembed"
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.docs.rs]
features = ["qwen3", "nomic-v2-moe"]
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2"
hf-hub = { version = "0.5.0", default-features = false, optional = true }
image = { version = "0.25.10", optional = true }
# The ONNX Runtime stack, behind the `onnx` feature (on by default).
ndarray = { version = "0.17.2", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, optional = true, features = [
  "ndarray", "std", "api-24"
] }
safetensors = { version = "0.8.0", optional = true }
serde_json = { version = "1" }
serde = { version = "1", features = ["derive"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
candle-nn = { version = "0.11.0", optional = true }
candle-core = { version = "0.11.0", optional = true }
# The metal feature compiles candle-metal-kernels already (through candle-core); the qwen3
# q/k norm-and-rope kernel names its encoder and pipeline types directly.
candle-metal-kernels = { version = "0.11.0", optional = true }

intel-mkl-src = { version = "0.8.1", optional = true }
accelerate-src = { version = "0.3.2", optional = true }

[features]
default = ["onnx", "ort-download-binaries-native-tls", "hf-hub-native-tls", "image-models"]

# The ONNX models (TextEmbedding, SparseTextEmbedding, Bgem3Embedding, ImageEmbedding,
# TextRerank) and the ONNX Runtime they run on. Every `ort-*` feature turns it on.
onnx = ["dep:ort", "dep:ndarray", "dep:safetensors"]

hf-hub = ["dep:hf-hub", "hf-hub?/ureq"]
hf-hub-native-tls = ["hf-hub", "hf-hub?/native-tls"]
hf-hub-rustls-tls = ["hf-hub", "hf-hub?/rustls-tls"]

ort-download-binaries = ["ort-download-binaries-native-tls"]
ort-download-binaries-native-tls = ["onnx", "ort/download-binaries", "ort/tls-native"]
ort-download-binaries-rustls-tls = ["onnx", "ort/download-binaries", "ort/tls-rustls"]
ort-load-dynamic = ["onnx", "ort/load-dynamic"]

# `qwen3` is unchanged for its users: the text model and reranker, the VL model, and the
# `from_hf` loaders. `qwen3-text` alone is the text model and reranker loaded from local
# files or GGUF, with no hf-hub and no image crates.
qwen3 = ["qwen3-text", "qwen3-vl", "hf-hub"]
qwen3-text = ["dep:candle-core", "dep:candle-nn"]
# Qwen3-VL loads only through `from_hf`, so it needs hf-hub.
qwen3-vl = ["qwen3-text", "dep:image", "hf-hub"]
nomic-v2-moe = ["dep:candle-core", "dep:candle-nn", "hf-hub"]

image-models = ["onnx", "dep:image"]
mkl = ["qwen3", "nomic-v2-moe", "dep:intel-mkl-src", "candle-nn/mkl", "candle-core/mkl"]
accelerate = ["qwen3", "nomic-v2-moe", "dep:accelerate-src", "candle-core/accelerate", "candle-nn/accelerate"]
directml = ["onnx", "ort/directml"]
webgpu = ["onnx", "ort/webgpu"]
cuda = ["qwen3", "nomic-v2-moe", "candle-core/cuda", "candle-nn/cuda"]
cudnn = ["qwen3", "nomic-v2-moe", "candle-core/cudnn", "candle-nn/cudnn", "cuda"]
metal = ["qwen3", "nomic-v2-moe", "candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels"]

# This feature does not change any code, but is used to limit tests if
# the user does not have `optimum-cli` or even python installed.
optimum-cli = []

# For compatibility recommend using hf-hub-native-tls
online = ["hf-hub-native-tls"]
