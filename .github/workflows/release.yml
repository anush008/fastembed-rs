name: Semantic Release
on:
  workflow_dispatch:
  
env:
  CARGO_TERM_COLOR: always
jobs:
  # Publish only a commit whose own push run of "Cargo Tests" (test.yml) passed.
  tests-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a green "Cargo Tests" run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$SHA" \
            --event push --status success --json databaseId --jq 'length')
          if [ "$green" -eq 0 ]; then
            echo "::error::No successful push run of 'Cargo Tests' for $SHA. Wait for it, or re-run it, then release."
            exit 1
          fi
          echo "'Cargo Tests' passed on $SHA."

  release:
    needs: tests-passed
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: "☁️ checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: "🔧 setup Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      - name: "📦 install dependencies"
        run: bun install -D @semantic-release/git conventional-changelog-conventionalcommits@8 semantic-release-cargo

      - name: Get Author Name and Email
        id: author_info
        run: |
          AUTHOR_NAME=$(git log -1 --pretty=format:%an ${{ github.sha }})
          AUTHOR_EMAIL=$(git log -1 --pretty=format:%ae ${{ github.sha }})
          {
            echo "AUTHOR_NAME<<EOF"
            echo "$AUTHOR_NAME"
            echo "EOF"
            echo "AUTHOR_EMAIL<<EOF"
            echo "$AUTHOR_EMAIL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
  
      - name: "Semantic release🚀"
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_AUTHOR_NAME: ${{ steps.author_info.outputs.AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ steps.author_info.outputs.AUTHOR_EMAIL }}
        run: |
            bun x semantic-release
