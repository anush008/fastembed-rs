name: Semantic Release
on:
  workflow_dispatch:
  
env:
  CARGO_TERM_COLOR: always
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: "☁️ checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: "🔧 setup Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      - name: "📦 install dependencies"
        # Exact versions, so that a new release of a tool cannot break the release job.
        # semantic-release 26 needs Node.js 26.13 or later.
        run: >-
          bun install -D --exact
          semantic-release@25.0.9
          @semantic-release/commit-analyzer@13.0.1
          @semantic-release/release-notes-generator@14.1.1
          @semantic-release/github@12.0.11
          @semantic-release/git@11.0.1
          conventional-changelog-conventionalcommits@8.0.0
          semantic-release-cargo@2.4.2

      - name: Get Author Name and Email
        id: author_info
        run: |
          AUTHOR_NAME=$(git log -1 --pretty=format:%an ${{ github.sha }})
          AUTHOR_EMAIL=$(git log -1 --pretty=format:%ae ${{ github.sha }})
          {
            echo "AUTHOR_NAME<<EOF"
            echo "$AUTHOR_NAME"
            echo "EOF"
            echo "AUTHOR_EMAIL<<EOF"
            echo "$AUTHOR_EMAIL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
  
      - name: "Semantic release🚀"
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_AUTHOR_NAME: ${{ steps.author_info.outputs.AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ steps.author_info.outputs.AUTHOR_EMAIL }}
        run: |
            bun x semantic-release
